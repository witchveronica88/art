<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
  <title>Art</title>
  <style>

:root {
  color-scheme: light;
  --bg: #F3F4F6;
  --card: #FFFFFF;
  --subtle: #E6E8EC;
  --text: #1C1F23;
  --muted: #5B626A;
  --line: #DEE1E5;
  --accent: #0D6B6B;
  --accent-soft: #DCEEEE;
  --disclosure-bg: #EDF0F2;
  --rule: #C3C8CE;
  --danger: #B3261E;
  --on-accent: #FFFFFF;
  --backdrop: rgba(28, 31, 35, .45);
  --radius: 16px;
  --pad: 20px;
  --fs-xl: 24px;
  --fs-l: 18px;
  --fs-m: 16px;
  --fs-s: 14px;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #131618;
    --card: #1D2124;
    --subtle: #2A2F33;
    --text: #ECEEF0;
    --muted: #A9B0B7;
    --line: #333A3F;
    --accent: #6CC6C2;
    --accent-soft: #1F3B3B;
    --disclosure-bg: #262B2F;
    --rule: #4A5258;
    --danger: #F2938C;
    --on-accent: #0F1A1A;
    --backdrop: rgba(0, 0, 0, .6);
  }
}

* { box-sizing: border-box; }
html {
  overflow-x: clip;
  scroll-behavior: smooth;
  overscroll-behavior: none;
  background: var(--bg);
}
body {
  margin: 0;
  min-width: 0;
  overflow-wrap: break-word;
  overscroll-behavior: none;
  background: var(--bg);
  color: var(--text);
  font-family: Pretendard, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  font-size: var(--fs-m);
  font-weight: 400;
  line-height: 1.6;
  letter-spacing: -0.01em;
  word-break: keep-all;
  -webkit-font-smoothing: antialiased;
}
button, input, textarea, summary { font: inherit; letter-spacing: inherit; }
button, a, summary { -webkit-tap-highlight-color: transparent; }
a { color: inherit; }
button { cursor: pointer; }
[hidden] { display: none; }
.wrap {
  width: min(100%, 560px);
  margin: 0 auto;
  padding: 0 16px calc(96px + env(safe-area-inset-bottom));
}
/* 화면 맨 위 제목: 카드 제목(24px)보다 작게, 위에 고정하지 않는다 */
.brand-row { display: flex; justify-content: center; margin: 0 0 12px; padding: 12px 0 0; }
.brand-row h1 {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 0;
  font-size: var(--fs-l);
  font-weight: 700;
  line-height: 1.4;
  letter-spacing: 0.04em;
}
.brand-row h1::before,
.brand-row h1::after {
  content: "";
  width: 36px;
  height: 4px;
  border-top: 1px solid var(--rule);
  border-bottom: 1px solid var(--rule);
}
.view-panel { min-width: 0; }

/* 메인 탭은 화면 아래에 고정한다 */
.primary-tabs {
  position: fixed;
  right: 0;
  bottom: 0;
  left: 0;
  z-index: 6;
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  padding: 0 max(16px, calc(50% - 280px)) env(safe-area-inset-bottom);
  border-top: 1px solid var(--line);
  background: var(--card);
}
.primary-tab {
  min-height: 44px;
  padding: 8px 16px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: var(--muted);
  font-size: var(--fs-s);
  font-weight: 700;
}
.primary-tab { min-height: 56px; border-radius: 0; }
.primary-tab[aria-selected="true"] { color: var(--accent); }

.filters,
.era-filters,
.term-filters {
  display: flex;
  gap: 8px;
  margin: 0 0 24px;
  flex-wrap: wrap;
  overflow-x: visible;
}
.filters::-webkit-scrollbar,
.era-filters::-webkit-scrollbar,
.term-filters::-webkit-scrollbar,
.study-tabs::-webkit-scrollbar { display: none; }
.filter,
.era-filter,
.term-filter {
  flex: 0 0 auto;
  min-height: 44px;
  padding: 8px 16px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--card);
  color: var(--muted);
  font-size: var(--fs-s);
  font-weight: 700;
  white-space: nowrap;
}
.term-filter { font-weight: 700; }
.filter[aria-selected="true"],
.era-filter[aria-pressed="true"],
.term-filter[aria-pressed="true"] {
  border-color: var(--accent-soft);
  background: var(--accent-soft);
  color: var(--accent);
  font-weight: 700;
}

.records,
.era-overviews,
.composer-list,
.instrument-list { display: grid; gap: 16px; }
.instrument-section,
.reading-card {
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--card);
}
/* 전시 카드와 시대 · 연표 · 사전 카드(fold-card)는 같은 모양이다 */
.record,
.fold-card {
  overflow: clip;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--card);
}
.record-top {
  display: grid;
  grid-template-columns: 64px minmax(0, 1fr);
  gap: 16px;
  align-items: center;
  padding: 16px;
  border-bottom: 1px solid var(--line);
  background: var(--card);
}
.date-block {
  display: flex;
  min-height: 80px;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding-right: 16px;
  border-right: 1px solid var(--line);
  text-align: center;
}
.date-block .month,
.date-block .weekday {
  color: var(--muted);
  font-size: var(--fs-s);
  line-height: 1.35;
}
.date-block .day {
  display: block;
  font-family: inherit;
  font-size: var(--fs-xl);
  font-weight: 700;
  line-height: 1.35;
}
.status {
  display: inline-flex;
  min-height: 24px;
  align-items: center;
  margin: 0 0 8px;
  padding: 4px 12px;
  border-radius: 999px;
  background: var(--accent-soft);
  color: var(--accent);
  font-size: var(--fs-s);
  font-weight: 700;
  line-height: 1.35;
}
.record h3 {
  margin: 0;
  text-wrap: balance;
  font-size: var(--fs-l);
  font-weight: 700;
  line-height: 1.35;
}
.place {
  margin: 8px 0 0;
  color: var(--muted);
  font-size: var(--fs-s);
}
.program { padding: 16px; }
.section-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin: 0 0 8px;
}
.section-row h4,
.program > h4,
.people h4 {
  margin: 0;
  font-size: var(--fs-m);
  font-weight: 700;
  line-height: 1.35;
}
.program-credits { margin: 0 0 24px; }
.piece { border-top: 1px solid var(--line); }
.piece:first-of-type { border-top: 0; }
.piece-body { padding: 0 0 16px; }
.piece-copy { display: grid; gap: 12px; }
.piece-copy p { margin: 0; color: var(--muted); font-family: inherit; font-size: var(--fs-m); }
.soloist-info { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--line); }
.soloist-info h4 { margin: 0 0 8px; font-size: var(--fs-m); font-weight: 700; line-height: 1.35; }
.soloist-info p { margin: 0; color: var(--muted); font-family: inherit; font-size: var(--fs-m); }

/* Every disclosure uses the same row and arrow. */
details { border-top: 1px solid var(--line); }
details:first-child { border-top: 0; }
summary {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 12px;
  min-height: 44px;
  align-items: center;
  padding: 12px 16px;
  color: var(--text);
  font-size: var(--fs-m);
  font-weight: 700;
  line-height: 1.35;
  list-style: none;
  text-decoration: none;
  cursor: pointer;
}
summary::-webkit-details-marker { display: none; }
summary::marker { content: ""; }
summary::after {   /* 펼침 표시: ＋, 펼치면 － */
  content: "";
  width: 11px;
  height: 11px;
  margin-right: 2px;
  background: linear-gradient(var(--muted), var(--muted)) center / 11px 1.5px no-repeat,
              linear-gradient(var(--muted), var(--muted)) center / 1.5px 11px no-repeat;
  transition: background-size .16s ease;
}
details[open] > summary::after { background-size: 11px 1.5px, 1.5px 0; }
details:not([open]) > :not(summary) { display: none; }
.performer-detail { border-top: 1px solid var(--line); }
.performer-detail:first-child { border-top: 0; }
.performer-detail > p {
  margin: 0;
  padding: 0 16px 16px;
  color: var(--muted);
  font-family: inherit;
  font-size: var(--fs-m);
}
.piece-performer { display: flex; }
.piece-performer::after { margin-left: auto; }
.piece-performer .role-label { margin-right: 0; color: var(--muted); font-size: var(--fs-s); font-weight: 400; }
.piece-performer .role-label::after { content: " · "; }
.piece-performer .performer-name { color: var(--text); font-size: var(--fs-m); font-weight: 700; }
.piece-summary-copy { min-width: 0; }
.piece-title { display: block; font-size: var(--fs-m); font-weight: 700; }
.piece-credit { display: block; margin-top: 4px; color: var(--muted); font-size: var(--fs-s); font-weight: 400; }
.record > details > summary { padding: 12px 16px; border-top: 1px solid var(--line); }
.detail-body { padding: 0 16px 16px; }
.info-detail > summary { padding-left: 0; padding-right: 0; }
.info-section { padding-top: 16px; }
.info-section h4 { margin: 0 0 8px; font-size: var(--fs-m); font-weight: 700; line-height: 1.35; }
.info-list { margin: 0; padding-left: 16px; color: var(--muted); }
.info-list li + li { margin-top: 4px; }
.booking {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 12px;
  align-items: center;
  padding: 16px 0;
  border-bottom: 1px solid var(--line);
}
.booking p { margin: 0; color: var(--muted); }
.booking strong { display: block; color: var(--text); font-size: var(--fs-m); }
.booking span { display: block; margin-top: 4px; font-size: var(--fs-s); overflow-wrap: anywhere; }
.copy {
  min-height: 44px;
  padding: 8px 16px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--card);
  color: var(--accent);
  font-size: var(--fs-s);
  font-weight: 700;
}
.caveat { margin: 16px 0 0; color: var(--muted); font-size: var(--fs-s); }
.prep-list { display: grid; gap: 0; }
.prep-link {
  display: grid;
  min-height: 44px;
  align-content: center;
  padding: 12px 0;
  border-top: 1px solid var(--line);
  color: var(--accent);
  text-decoration: none;
}
.prep-link:first-child { border-top: 0; }
.prep-link strong { font-size: var(--fs-m); font-weight: 700; }
.prep-link strong::after { content: " ↗"; }
.prep-link span { color: var(--muted); font-size: var(--fs-s); }

/* Study navigation */
.study-search-wrap { position: relative; margin: 0 0 16px; }
.study-search {
  width: 100%;
  min-height: 44px;
  padding: 8px 16px;
  border: 1px solid var(--line);
  border-radius: 12px;
  outline: 0;
  background: var(--card);
  color: var(--text);
  font-size: var(--fs-m);
}
.study-search::placeholder { color: var(--muted); }
.study-search:focus { border-color: var(--accent); }
.search-results {
  position: absolute;
  inset: calc(100% + 4px) 0 auto;
  z-index: 4;
  max-height: 384px;
  overflow-y: auto;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--card);
}
.search-result {
  display: grid;
  grid-template-columns: 64px minmax(0, 1fr) auto;
  gap: 8px;
  width: 100%;
  min-height: 44px;
  align-items: center;
  padding: 8px 12px;
  border: 0;
  border-top: 1px solid var(--line);
  background: transparent;
  color: var(--accent);
  text-align: left;
}
.search-result::after { content: none; }
.search-result:first-child { border-top: 0; }
.search-kind { color: var(--accent); font-size: var(--fs-s); font-weight: 700; }
.search-copy strong { display: block; font-size: var(--fs-m); font-weight: 700; }
.search-copy span { display: block; color: var(--muted); font-size: var(--fs-s); }
.search-empty, .term-empty, .empty { margin: 0; padding: 24px 16px; color: var(--muted); text-align: center; }
.empty strong { display: block; color: var(--text); }
.study-tabs {
  display: flex;
  gap: 16px;
  margin: 0 0 16px;
  overflow-x: auto;
  border-bottom: 1px solid var(--line);
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}
.study-tab {
  position: relative;
  flex: 0 0 auto;
  min-height: 44px;
  padding: 8px 0;
  border: 0;
  background: transparent;
  color: var(--muted);
  font-size: var(--fs-s);
  font-weight: 700;
  white-space: nowrap;
}
.study-tab[aria-selected="true"] { color: var(--accent); font-weight: 700; }
.study-count { margin: 0 0 12px; color: var(--muted); font-size: var(--fs-s); }
.timeline-heading-row { margin-top: 24px; }
.dictionary-subtabs {
  display: flex;
  flex-wrap: wrap;
  gap: 0 16px;
  margin: 0 0 16px;
  border-bottom: 1px solid var(--line);
}
.dictionary-subtab {
  position: relative;
  min-height: 44px;
  padding: 8px 0;
  border: 0;
  background: transparent;
  color: var(--muted);
  font-size: var(--fs-m);
  font-weight: 700;
  line-height: 1.35;
  text-align: left;
}
.dictionary-subtab[aria-selected="true"] { color: var(--accent); font-weight: 700; }
.dictionary-subpanel { line-height: 1.6; }

.key-guide { margin: 0; padding-left: 16px; color: var(--muted); }
.key-table { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); overflow: hidden; border: 1px solid var(--line); border-radius: 12px; }
.key-cell { padding: 8px 4px; border-left: 1px solid var(--line); text-align: center; }
.key-cell:first-child { border-left: 0; }
.key-cell strong, .key-cell span { display: block; }
.key-cell span { color: var(--muted); font-size: var(--fs-s); }
.study-card-body li + li,
.key-guide li + li { margin-top: 8px; }
.era-genres { margin-top: 12px; }
.era-genres .genre-text { color: var(--muted); font-size: var(--fs-s); font-weight: 400; }
.era-genres .study-link {
  min-height: 0;
  padding: 0;
  font-size: var(--fs-s);
  font-weight: 400;
}
.era-genres .study-link-list > * + *::before {
  content: "·";
  margin: 0 6px;
  color: var(--muted);
  font-size: var(--fs-s);
  font-weight: 400;
}
.reading-card h4 { margin: 24px 0 8px; font-size: var(--fs-m); font-weight: 700; line-height: 1.35; }
.related-block {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 4px 12px;
  margin-top: 24px;
  padding-top: 12px;
  border-top: 1px solid var(--line);
}
.related-label { color: var(--muted); font-size: var(--fs-s); font-weight: 400; line-height: 1.6; }
.study-link-list { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0; font-size: var(--fs-s); font-weight: 400; line-height: 1.6; }
.related-block:not(.era-genres) .study-link-list .study-link + .study-link::before {
  content: "·";
  margin: 0 6px;
  color: var(--muted);
  font-size: var(--fs-s);
  font-weight: 400;
}
.study-link,
.composer-link {
  display: inline-flex;
  min-height: 44px;
  align-items: center;
  padding: 4px 0;
  border: 0;
  background: transparent;
  color: var(--accent);
  font-size: var(--fs-m);
  font-weight: 700;
  text-align: left;
  text-decoration: none;
}
.related-block .study-link {
  min-height: 0;
  padding: 0;
  font-size: var(--fs-s);
  font-weight: 400;
}
.study-link::after,
.composer-link::after { content: none; }
.source-link {
  display: inline-flex;
  min-height: 44px;
  align-items: center;
  color: var(--accent);
  font-size: var(--fs-m);
  font-weight: 700;
  text-decoration: none;
}
.source-link::after { content: " ↗"; }
.reference-sources { margin-top: 16px; }
.concerto-flow { display: grid; gap: 8px; }
.concerto-flow div { display: grid; grid-template-columns: 48px minmax(0, 1fr); gap: 8px; color: var(--muted); }
.concerto-flow strong { color: var(--text); }

.timeline-list { display: grid; gap: 0; }
.timeline-row {
  display: grid;
  grid-template-columns: 56px minmax(0, 1fr);
  gap: 12px;
  align-items: start;
  border-top: 1px solid var(--line);
  font-size: var(--fs-m);
  line-height: 1.6;
  text-align: left;
}
.timeline-row:first-child { border-top: 0; }
.timeline-year { color: var(--muted); font-size: var(--fs-m); font-weight: 700; line-height: inherit; }
.timeline-copy { min-width: 0; color: var(--text); font-size: var(--fs-m); line-height: inherit; }
.timeline-copy .study-link {
  display: inline;
  min-height: 0;
  padding: 0;
  font-size: var(--fs-m);
  line-height: inherit;
  vertical-align: baseline;
}
.term-name { font-size: var(--fs-m); font-weight: 700; }
.term-row[hidden] { display: none; }

.instrument-intro { margin: 0 0 16px; }
.instrument-intro p { margin: 0; }
.instrument-intro p + p { margin-top: 8px; }
.instrument-body { padding: 0 16px 16px; }
.instrument-body > p { margin: 0 0 12px; color: var(--muted); }
.instrument-row { padding: 12px 0; border-top: 1px solid var(--line); }
.instrument-row strong { display: block; font-size: var(--fs-m); font-weight: 700; }
.instrument-row span { display: block; margin-top: 4px; color: var(--muted); }
.reading-card { padding: 16px; }
.reading-card > p { margin: 0; }
.catalogue-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 16px; }
.catalogue-row { padding: 12px 0; border-top: 1px solid var(--line); }
.catalogue-row strong { display: block; font-size: var(--fs-m); font-weight: 700; }
.catalogue-row span { display: block; margin-top: 4px; color: var(--muted); }
.note-field { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--line); }
.note-field label { display: block; margin-bottom: 8px; font-size: var(--fs-m); font-weight: 700; }
.note-field textarea {
  width: 100%;
  min-height: 96px;
  resize: vertical;
  padding: 12px 16px;
  border: 1px solid var(--line);
  border-radius: 12px;
  outline: 0;
  background: var(--card);
  color: var(--text);
}
.note-field textarea:focus { border-color: var(--accent); }

.footnote { margin: 24px 0 0; color: var(--muted); font-size: var(--fs-s); }
.toast {
  position: fixed;
  left: 50%;
  bottom: calc(72px + env(safe-area-inset-bottom));
  z-index: 8;
  transform: translateX(-50%);
  padding: 8px 16px;
  border-radius: 999px;
  background: var(--text);
  color: var(--card);
  font-size: var(--fs-s);
  opacity: 0;
  pointer-events: none;
}
.toast.show { opacity: 1; }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (max-width: 440px) {
  .record-top { grid-template-columns: 56px minmax(0, 1fr); gap: 12px; }
  .date-block { padding-right: 12px; }
  .catalogue-grid { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  summary::after { transition: none; }
}

  
[hidden] { display: none !important; }
.add-record { display: block; width: 100%; min-height: 48px; margin: 0 0 16px; padding: 8px 16px; border: 1px dashed var(--accent); border-radius: 12px; background: transparent; color: var(--accent); font-size: var(--fs-m); font-weight: 700; }
.record-actions { display: flex; justify-content: flex-end; border-top: 1px solid var(--line); }
.record-actions button { min-height: 44px; padding: 8px 16px; border: 0; background: transparent; color: var(--accent); font-size: var(--fs-m); font-weight: 700; }
.sheet-backdrop { position: fixed; inset: 0; z-index: 20; background: var(--backdrop); }
.sheet { position: fixed; left: 50%; bottom: 0; z-index: 21; width: min(100%, 560px); max-height: 92vh; overflow-y: auto; transform: translateX(-50%); padding: 8px 16px calc(24px + env(safe-area-inset-bottom)); border-radius: 16px 16px 0 0; background: var(--card); }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 0 8px; }
.sheet-head h3 { margin: 0; font-size: var(--fs-l); font-weight: 700; }
.sheet-close { min-height: 44px; padding: 0 4px; border: 0; background: transparent; color: var(--muted); font-size: var(--fs-m); font-weight: 700; }
.field { margin: 0 0 16px; min-width: 0; }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.field label { display: block; margin: 0 0 4px; color: var(--muted); font-size: var(--fs-m); font-weight: 700; }
.field input, .field textarea { width: 100%; min-height: 44px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: var(--text); font-size: var(--fs-m); }
.field textarea { resize: vertical; line-height: 1.6; }
.field input:focus, .field textarea:focus { border-color: var(--accent); outline: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 0 4px 0 12px; border: 1px solid var(--line); border-radius: 999px; font-size: var(--fs-m); }
.chip-x { min-height: 36px; padding: 0 8px; border: 0; background: transparent; color: var(--muted); font-size: var(--fs-s); }
.form-error { margin: 0 0 12px; color: var(--danger); font-size: var(--fs-m); }
.sheet-actions { display: grid; gap: 8px; }
.btn-primary, .btn-danger { min-height: 48px; border-radius: 12px; font-size: var(--fs-m); font-weight: 700; }
.btn-primary { border: 0; background: var(--accent); color: var(--on-accent); }
.btn-danger { border: 1px solid var(--line); background: transparent; color: var(--danger); }
.btn-danger.confirm { border-color: var(--danger); background: var(--danger); color: var(--on-accent); }
body.sheet-open { overflow: hidden; }
.empty { padding: 32px 16px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--card); color: var(--muted); text-align: center; }
.record-top { grid-template-columns: 76px minmax(0, 1fr); padding: var(--pad); }
.timeline-row { grid-template-columns: 96px minmax(0, 1fr); }
.related-block { display: flex; flex-wrap: nowrap; align-items: baseline; gap: 16px; margin-top: 20px; padding-top: 0; border-top: 0; }
.related-block .study-link-list { flex: 1 1 0; min-width: 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; }
.related-block:not(.era-genres) .study-link-list .study-link + .study-link::before,
.era-genres .study-link-list > * + *::before { content: none; margin: 0; }
.related-label { display: block; flex: 0 0 auto; margin: 0; }
.related-block .study-link, .related-block .genre-text { min-height: 0; padding: 0; font-size: var(--fs-s); font-weight: 400; line-height: 1.6; }
.related-block .genre-text { color: var(--muted); }

/* ---------- 카드 규칙: 카드 머리 + ＋ 줄, 펼치면 안쪽에 또 ＋ 줄 ---------- */
.study-cards { display: grid; gap: 16px; }
.fold-head { padding: var(--pad); border-bottom: 1px solid var(--line); }
.fold-title { display: flex; align-items: baseline; gap: 10px; }
.fold-title h3 { min-width: 0; margin: 0; font-size: var(--fs-l); font-weight: 700; line-height: 1.3; letter-spacing: -0.02em; text-wrap: balance; }
.fold-head p { margin: 8px 0 0; color: var(--muted); font-size: var(--fs-s); }
.card-badge {
  flex: 0 0 auto;
  margin-left: auto;
  padding: 2px 10px;
  border-radius: 999px;
  background: var(--subtle);
  color: var(--muted);
  font-size: var(--fs-s);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.record > details,
.fold-card > details { border-top: 1px solid var(--line); }
.record-top + details,
.fold-head + details { border-top: 0; }
.record > details > summary,
.fold-card > details > summary {
  min-height: 52px;
  padding: 14px var(--pad);
  background: var(--card);
}
.summary-copy { display: flex; min-width: 0; align-items: baseline; gap: 8px; }
.summary-copy > span:first-child { flex: 0 0 auto; }
.summary-meta { min-width: 0; overflow: hidden; color: var(--muted); font-size: var(--fs-s); font-weight: 400; text-overflow: ellipsis; white-space: nowrap; }
/* 펼친 내용은 제목 줄 아래 선에서 띄운다 */
.detail-body { padding: 16px var(--pad) var(--pad); }
.detail-body.row-list { padding-top: 0; padding-bottom: 8px; }
.detail-body > ul,
.study-card-body ul { margin: 0; padding-left: 18px; }
.detail-body > ul li + li { margin-top: 8px; }
.detail-body > ul li::marker,
.study-card-body li::marker { color: var(--accent); }
.memo-text { margin: 0; white-space: pre-wrap; }
.record .artist-list .study-link { min-height: 0; padding: 0; }
.artist-list { display: flex; flex-wrap: wrap; gap: 8px 20px; }
/* 안쪽 ＋ 줄: 작가 · 용어 */
.nested-composer,
.term-row { border-top: 1px solid var(--line); }
.nested-composer:first-child,
.term-row:first-child { border-top: 0; }
.nested-composer > summary,
.term-row > summary { min-height: 52px; padding: 12px 0; background: transparent; }
.nested-composer > summary { grid-template-columns: minmax(0, 1fr) auto auto; }
.composer-summary { display: contents; }
.composer-summary strong { min-width: 0; color: var(--text); font-size: var(--fs-m); font-weight: 700; }
.composer-years { justify-self: end; color: var(--muted); font-size: var(--fs-s); font-weight: 400; font-variant-numeric: tabular-nums; white-space: nowrap; }
.study-card-body,
.term-body { min-width: 0; padding: 12px 0 16px; line-height: 1.7; }
.study-card-body > p { margin: 0; }
.composer-detail-name { padding: 0 0 8px; color: var(--muted); font-size: var(--fs-s); }
.study-card-body h4 { margin: 24px 0 8px; color: var(--muted); font-size: var(--fs-s); font-weight: 700; letter-spacing: 0.02em; }
.study-card-body ul.work-list { padding: 0; list-style: none; }
.work-row { padding: 10px 0; border-top: 1px solid var(--line); }
.work-row:first-child { border-top: 0; padding-top: 0; }
.study-card-body .work-row + .work-row { margin-top: 0; }
.work-title { display: block; font-weight: 700; }
.work-note { display: block; margin-top: 2px; color: var(--muted); font-size: var(--fs-s); }
.work-row.work-highlight { color: inherit; font-weight: inherit; }
.work-row.work-highlight .work-title { color: var(--accent); }
.term-definition { margin: 0; color: var(--text); }
.term-body .related-block { margin-top: 12px; }
.fold-list { padding: 0 var(--pad) 8px; }
.timeline-list { display: grid; padding: 4px 0 8px; }
.timeline-row { padding: 12px var(--pad); }

/* ---------- 펼친 표시: 제목 줄 배경 + 왼쪽 컬러바, 글자 색은 그대로 ---------- */
#exhibit-view { --stick: 0px; }
#study-view { --stick: 56px; }
.record > details[open],
.fold-card > details[open] { box-shadow: inset 3px 0 0 var(--accent); }
.record > details[open] > summary,
.fold-card > details[open] > summary {
  position: sticky;
  top: var(--stick);
  z-index: 3;
  background: var(--disclosure-bg);
  box-shadow: inset 3px 0 0 var(--accent), 0 1px 0 var(--line);
}
.term-row[open] > summary {
  position: sticky;
  top: calc(var(--stick) + 52px);
  z-index: 2;
  margin: 0 calc(-1 * var(--pad));
  padding-right: var(--pad);
  padding-left: var(--pad);
  background: var(--disclosure-bg);
  box-shadow: inset 3px 0 0 var(--accent), 0 1px 0 var(--line);
}
/* 한 단계 안쪽(작가 줄)은 바깥 줄과 구분되게: 배경은 안쪽 폭만, 컬러바 없음,
   펼친 내용은 왼쪽 안내선과 함께 한 칸 들여 쓴다 */
.nested-composer[open] > summary {
  position: sticky;
  top: calc(var(--stick) + 52px);
  z-index: 2;
  margin: 0 -12px;
  padding-right: 12px;
  padding-left: 12px;
  border-radius: 8px;
  background: var(--disclosure-bg);
  box-shadow: 0 0 0 5px var(--card);
}
.nested-composer > .study-card-body {
  margin: 4px 0 8px 0;
  padding: 8px 0 8px 14px;
  border-left: 2px solid var(--line);
}
/* 사전 카드에 바로 나오는 용어 줄은 카드의 첫 단계라서 펼친 내용까지 컬러바를 이어 세운다 */
.fold-list .term-row[open] > summary { top: var(--stick); }
.fold-list .term-row[open] > .term-body {
  margin: 0 calc(-1 * var(--pad));
  padding-right: var(--pad);
  padding-left: var(--pad);
  box-shadow: inset 3px 0 0 var(--accent);
}
.record > details,
.fold-card > details,
.fold-list .term-row,
.fold-card { scroll-margin-top: var(--stick); }
.nested-composer { scroll-margin-top: calc(var(--stick) + 52px); }
.work-row { scroll-margin-top: calc(var(--stick) + 104px); }

/* ---------- 카드가 많으면 탭: 가로로 미는 알약 탭, 스크롤해도 위에 고정 ---------- */
.chip-tabs {
  position: sticky;
  top: 0;
  z-index: 4;
  display: flex;
  gap: 8px;
  margin: 0 -16px 8px;
  padding: 8px 16px;
  background: var(--bg);
  overflow-x: auto;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}
.chip-tabs::-webkit-scrollbar { display: none; }
.chip-tab {
  flex: 0 0 auto;
  min-height: 40px;
  padding: 8px 14px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--card);
  color: var(--muted);
  font-size: var(--fs-s);
  font-weight: 700;
  white-space: nowrap;
}
.chip-tab[aria-selected="true"] {
  border-color: var(--accent-soft);
  background: var(--accent-soft);
  color: var(--accent);
}
@media (max-width: 440px) {
  .record-top { grid-template-columns: 60px minmax(0, 1fr); gap: 12px; }
}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="brand-row"><h1>Art</h1></div>
    <nav class="primary-tabs" aria-label="미술 기록 메뉴" role="tablist">
      <button class="primary-tab" id="tab-exhibits" type="button" role="tab" aria-controls="exhibit-view" aria-selected="true" data-view="exhibits">전시 기록</button>
      <button class="primary-tab" id="tab-study" type="button" role="tab" aria-controls="study-view" aria-selected="false" data-view="study">미술 공부</button>
    </nav>

    <section class="view-panel" id="exhibit-view" role="tabpanel" aria-labelledby="tab-exhibits">
      <nav class="filters" aria-label="전시 기록 필터" role="tablist">
        <button class="filter" id="filter-all" type="button" role="tab" aria-controls="records-panel" aria-selected="true" data-filter="all" data-label="전체">전체 0</button>
        <button class="filter" id="filter-upcoming" type="button" role="tab" aria-controls="records-panel" aria-selected="false" data-filter="upcoming" data-label="예정">예정 0</button>
        <button class="filter" id="filter-seen" type="button" role="tab" aria-controls="records-panel" aria-selected="false" data-filter="seen" data-label="관람 완료">관람 완료 0</button>
      </nav>
      <button class="add-record" id="add-record" type="button">전시 추가</button>
      <section class="records" id="records-panel" role="tabpanel" aria-labelledby="filter-all" aria-live="polite" tabindex="0">
        <div class="empty" id="empty" role="status"><strong>기록한 전시가 아직 없음</strong><span id="empty-copy">전시 추가를 눌러 보러 갈 전시를 기록하세요.</span></div>
      </section>
      <p class="footnote">전시 일정과 운영 시간은 바뀔 수 있음. 관람 전 미술관 공식 안내 확인. 기록은 이 기기에만 저장됨.</p>
    </section>

    <section class="view-panel" id="study-view" role="tabpanel" aria-labelledby="tab-study" hidden>
      <div class="study-search-wrap">
        <input class="study-search" id="study-search" type="search" inputmode="search" autocomplete="off" aria-label="시대, 작가, 대표작, 미술사 연표, 사전 항목 통합 검색" aria-controls="study-search-results" aria-expanded="false" placeholder="미술 공부 전체 검색">
        <div class="search-results" id="study-search-results" role="listbox" hidden></div>
      </div>

      <nav class="study-tabs" aria-label="미술 공부 목차" role="tablist">
        <button class="study-tab" type="button" role="tab" aria-selected="true" data-study-section="eras">시대와 작가</button>
        <button class="study-tab" type="button" role="tab" aria-selected="false" data-study-section="timeline">연표</button>
        <button class="study-tab" type="button" role="tab" aria-selected="false" data-study-section="dictionary">미술 사전</button>
      </nav>

      <section class="study-panel" id="study-eras" data-study-panel="eras">
        <nav class="chip-tabs" id="region-tabs" role="tablist" aria-label="지역 선택"></nav>
        <div class="study-cards" id="era-overviews"></div>
      </section>

      <section class="study-panel" id="study-timeline" data-study-panel="timeline" hidden>
        <section class="fold-card">
          <div class="fold-head">
            <div class="fold-title"><h3>미술사 연표</h3><span class="card-badge" id="timeline-count"></span></div>
            <p>색이 있는 이름을 누르면 작가 설명으로 이동</p>
          </div>
          <div class="timeline-list" id="timeline-list"></div>
        </section>
      </section>

      <section class="study-panel" id="study-dictionary" data-study-panel="dictionary" hidden>
        <nav class="chip-tabs" id="dictionary-filters" role="tablist" aria-label="사전 분류"></nav>
        <div class="study-cards" id="dictionary-list"></div>
      </section>
      <p class="footnote">작품 연도와 소장처는 바뀔 수 있음. 관람 전 미술관 공식 안내 확인.</p>
    </section>
  </main>

  <div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
    <div class="sheet-head">
      <h3 id="sheet-title">전시 추가</h3>
      <button class="sheet-close" id="sheet-close" type="button">닫기</button>
    </div>
    <form id="exhibit-form" novalidate>
      <div class="field"><label for="f-title">전시명</label><input id="f-title" type="text" autocomplete="off" required></div>
      <div class="field"><label for="f-venue">장소</label><input id="f-venue" type="text" autocomplete="off" placeholder="미술관 이름"></div>
      <div class="field-row">
        <div class="field"><label for="f-date">날짜</label><input id="f-date" type="date" required></div>
        <div class="field"><label for="f-time">시작 시간</label><input id="f-time" type="time"></div>
      </div>
      <div class="field">
        <label for="f-artist">함께 보기</label>
        <input id="f-artist" type="text" list="artist-options" autocomplete="off" placeholder="작가 이름을 고르거나 입력">
        <datalist id="artist-options"></datalist>
        <div class="chips" id="f-chips"></div>
      </div>
      <div class="field"><label for="f-memo">메모</label><textarea id="f-memo" rows="4" placeholder="보고 싶은 작품, 감상"></textarea></div>
      <p class="form-error" id="form-error" role="alert" hidden></p>
      <div class="sheet-actions">
        <button class="btn-primary" type="submit">저장</button>
        <button class="btn-danger" id="btn-delete" type="button" hidden>삭제</button>
      </div>
    </form>
  </section>

    /* ---------- study: helpers ---------- */

      var parts = rest.split(', ');
      return { koName: name.split(' (')[0], years: parts[0] || '', country: parts.slice(1).join(', '), latin: (name.match(/\((.*)\)$/) || ['', ''])[1] };
    }

    function renderTimeline() {
      var list = $('timeline-list');
      $('timeline-count').textContent = D.timeline.length + '개';
      var names = D.artists.map(function (a) { return a.short; }).concat(Object.keys(aliases));
      names.sort(function (a, b) { return b.length - a.length; });
      D.timeline.forEach(function (ev) {
        var row = el('div', 'timeline-row');
        row.appendChild(el('strong', 'timeline-year', ev[0]));
        var copy = el('span', 'timeline-copy');
        var text = ev[1];
        var matches = [];
        names.forEach(function (n) {
          var start = 0, idx;
          while ((idx = text.indexOf(n, start)) !== -1) { matches.push({ index: idx, name: n }); start = idx + n.length; }
        });
        matches.sort(function (a, b) { return a.index - b.index || b.name.length - a.name.length; });
        var cursor = 0;
        matches.forEach(function (m) {
          if (m.index < cursor) return;
          copy.appendChild(document.createTextNode(text.slice(cursor, m.index)));
          var end = m.index + m.name.length;
          var particle = /^[이가은는의을를과와]/.test(text.slice(end)) ? text.charAt(end) : '';
          var link = createLink(m.name, 'artist', aliases[m.name] || m.name);
          if (particle) link.querySelector('.study-link-key').appendChild(document.createTextNode(particle));
          copy.appendChild(link);
          cursor = end + particle.length;
          if (/^\s/.test(text.slice(cursor))) {
            copy.appendChild(document.createTextNode(' '));
            cursor += (text.slice(cursor).match(/^\s+/) || [''])[0].length;
          } else if (text.charAt(cursor) && !/^[,.;:!?…)]/.test(text.charAt(cursor))) {
            copy.appendChild(document.createTextNode(' '));
          }
        });
        copy.appendChild(document.createTextNode(text.slice(cursor)));
        row.appendChild(copy);
        list.appendChild(row);
      });
    }

    /* ---------- study: navigation ---------- */
    function activateStudySection(section) {
      studyTabs.forEach(function (tab) {

        tab.setAttribute('aria-selected', sel ? 'true' : 'false');
        tab.tabIndex = sel ? 0 : -1;
      });
      studyPanels.forEach(function (p) { p.hidden = p.getAttribute('data-study-panel') !== section; });
    }
    function syncChipTabs(nav, attr, value) {
      qsa('.chip-tab', nav).forEach(function (b) {
        var sel = b.getAttribute(attr) === value;
        b.setAttribute('aria-selected', sel ? 'true' : 'false');
        b.tabIndex = sel ? 0 : -1;
        if (sel && nav.offsetParent) nav.scrollTo({ left: b.offsetLeft - (nav.clientWidth - b.offsetWidth) / 2 });
      });
    }
    function selectCategory(cat) {
      if (categories.indexOf(cat) === -1) cat = categories[0];
      activeCategory = cat;
      syncChipTabs($('dictionary-filters'), 'data-category', cat);
      qsa('[data-dictionary-category]').forEach(function (p) { p.hidden = p.getAttribute('data-dictionary-category') !== cat; });
      storageSet('art-dictionary', cat);
    }
    function reveal(target) {
      if (!target) return;
      if (target.tagName === 'DETAILS') target.open = true;
      window.requestAnimationFrame(function () {
        target.focus({ preventScroll: true });
        target.scrollIntoView({ block: 'start' });
      });
    }
    function activatePrimaryTab(button) {

    function closeSearch() {

      $('study-search').setAttribute('aria-expanded', 'false');
    }
    function setRegion(r) {
      if (!qsa('[data-region-jump]').some(function (b) { return b.getAttribute('data-region-jump') === r; })) r = D.eras[0].name.split(' · ')[0];
      activeRegion = r;

    // 고른 탭 줄이 화면 위로 지나갔으면, 탭을 바꿀 때 탭 줄 자리로 돌아간다
    function backToTabs(nav) {
      var panel = nav.parentElement;
      if (panel.getBoundingClientRect().top < 0) panel.scrollIntoView({ block: 'start', behavior: 'instant' });
    }
    function goTo(kind, value) {
      closeSearch();
      activatePrimaryTab($('tab-study'));
      if (kind === 'artist' || kind === 'work') {
        var parts = kind === 'work' ? value.split('::') : [value];
        var a = artistByName[parts[0]];
        if (!a) return;
        activateStudySection('eras');
        var card = $(a.id);
        qsa('.composer-card[open]').forEach(function (c) { if (c !== card) c.open = false; });
        setRegion(a.era.split(' · ')[0]);
        var egroup = qsa('[data-era-card]').filter(function (g) { return g.getAttribute('data-era-card') === a.era; })[0];
        if (egroup) egroup.querySelector('.era-artists').open = true;
        card.open = true;
        if (kind === 'work') {
          var row = $(a.id + '-work-' + (Number(parts[1]) + 1));
          window.requestAnimationFrame(function () {
            if (!row) return;
            qsa('.work-highlight').forEach(function (r) { r.classList.remove('work-highlight'); });
            row.classList.add('work-highlight');
            row.scrollIntoView({ block: 'start' });
            setTimeout(function () { row.classList.remove('work-highlight'); }, 2400);
          });
        } else {
          reveal(card);
        }
        return;
      }
      if (kind === 'era') {
        activateStudySection('eras');
        if (value.indexOf(' · ') !== -1) setRegion(value.split(' · ')[0]);
        reveal(qsa('[data-era-card]').filter(function (c) { return c.getAttribute('data-era-card') === value; })[0]);
        return;
      }
      if (kind === 'timeline') {
        activateStudySection('timeline');
        window.requestAnimationFrame(function () { studyView.scrollIntoView({ block: 'start' }); });
        return;
      }
      if (kind === 'term') {
        var t = termByName[value];
        if (!t) return;
        activateStudySection('dictionary');
        selectCategory(t.category);
        reveal(qsa('[data-dictionary-card]').filter(function (c) {
          return c.getAttribute('data-dictionary-card') === value && !c.closest('[data-dictionary-category]').hidden;
        })[0]);
        return;
      }
      activateStudySection(value || 'eras');
      window.requestAnimationFrame(function () { studyView.scrollIntoView({ block: 'start' }); });
    }

    /* ---------- study: search ---------- */

    var entries = buildEntries();
    function updateSearch() {
      var input = $('study-search'), box = $('study-search-results');
      var q = input.value.trim().toLocaleLowerCase('ko-KR');
      box.textContent = '';
      if (!q) { box.hidden = true; input.setAttribute('aria-expanded', 'false'); return; }
      var matches = entries.map(function (en) {
        var title = en.title.toLocaleLowerCase('ko-KR');
        var alias = (en.alias || en.title).toLocaleLowerCase('ko-KR');
        var s = en.search.toLocaleLowerCase('ko-KR');
        var score = (title === q || alias === q) ? 0 : (title.indexOf(q) === 0 || alias.indexOf(q) === 0) ? 1 : (title.indexOf(q) !== -1 || alias.indexOf(q) !== -1) ? 2 : s.indexOf(q) !== -1 ? 3 : 9;
        return { en: en, score: score };
      }).filter(function (r) { return r.score < 9; }).sort(function (a, b) {
        return a.score - b.score || a.en.title.localeCompare(b.en.title, 'ko-KR');
      }).slice(0, 12);
      if (!matches.length) box.appendChild(el('p', 'search-empty', '찾는 내용이 없음'));
      matches.forEach(function (r) {
        var b = el('button', 'search-result');
        b.type = 'button';
        b.setAttribute('role', 'option');
        b.setAttribute('data-link-kind', r.en.kind);
        b.setAttribute('data-link-value', r.en.value);
        b.appendChild(el('span', 'search-kind', r.en.type));
        var c = el('span', 'search-copy');
        c.appendChild(el('strong', '', r.en.title));
        c.appendChild(el('span', '', r.en.subtitle));
        b.appendChild(c);
        box.appendChild(b);
      });
      box.hidden = false;
      input.setAttribute('aria-expanded', 'true');
    }

    /* ---------- exhibits: storage ---------- */
    var records = [];
    var DELETED_KEY = STORE_KEY + '-deleted';
    var deletedIds = [];
    function loadRecords() {
      try { var raw = window.localStorage.getItem(STORE_KEY); records = raw ? JSON.parse(raw) : []; if (!Array.isArray(records)) records = []; }
      catch (e) { records = []; }
      try { var d = window.localStorage.getItem(DELETED_KEY); deletedIds = d ? JSON.parse(d) : []; if (!Array.isArray(deletedIds)) deletedIds = []; }
      catch (e) { deletedIds = []; }
      // exhibits.js 기록을 합침 (같은 id는 이 브라우저에서 수정한 쪽이 우선)
      var shipped = Array.isArray(window.ART_EXHIBITS) ? window.ART_EXHIBITS : [];
      var have = {};
      records.forEach(function (r) { have[r.id] = true; });
      shipped.forEach(function (r) {
        if (r && r.id && !have[r.id] && deletedIds.indexOf(r.id) < 0) records.push(Object.assign({ artists: [] }, r));
      });
    }
    function saveRecords() {
      try { window.localStorage.setItem(STORE_KEY, JSON.stringify(records)); return true; }
      catch (e) { showToast('저장하지 못함'); return false; }
    }
    function todayKR() {
      var parts = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Seoul', year: 'numeric', month: '2-digit', day: '2-digit' }).formatToParts(new Date());
      var v = {};
      parts.forEach(function (p) { v[p.type] = p.value; });
      return v.year + '-' + v.month + '-' + v.day;
    }
    var WEEK = ['일요일', '월요일', '화요일', '수요일', '목요일', '금요일', '토요일'];
    function fmtTime(t) {
      if (!t) return '';
      var p = t.split(':'), h = Number(p[0]), m = p[1];
      return (h < 12 ? '오전 ' : '오후 ') + (h % 12 === 0 ? 12 : h % 12) + ':' + m;
    }

    /* ---------- exhibits: render ---------- */
    var filter = 'all';
    var recordsPanel = $('records-panel');
    var emptyBox = $('empty');
    function renderRecords() {
      // 1분마다 다시 그려도 펼쳐 둔 줄은 그대로 둔다
      var openRows = qsa('.record > details[open]', recordsPanel).map(function (d) {
        return d.parentElement.getAttribute('data-id') + '|' + d.querySelector('summary').textContent;
      });
      qsa('.record', recordsPanel).forEach(function (n) { n.remove(); });
      var today = todayKR();
      var counts = { all: records.length, upcoming: 0, seen: 0 };
      records.forEach(function (r) { r._status = r.date < today ? 'seen' : 'upcoming'; counts[r._status] += 1; });
      var sorted = records.slice().sort(function (a, b) {
        if (a._status === b._status) {
          if (a._status === 'upcoming') return a.date.localeCompare(b.date) || (a.time || '').localeCompare(b.time || '');
          return b.date.localeCompare(a.date);
        }
        if (filter === 'all') return a._status === 'upcoming' ? -1 : 1;
        return b.date.localeCompare(a.date);
      });
      var nextUpcoming = sorted.filter(function (r) { return r._status === 'upcoming'; })[0];
      var shown = sorted.filter(function (r) { return filter === 'all' || r._status === filter; });

      shown.forEach(function (r) {
        var card = el('article', 'record');
        card.setAttribute('data-id', r.id);
        card.setAttribute('data-status', r._status);
        var d = r.date.split('-');
        var weekday = WEEK[new Date(Number(d[0]), Number(d[1]) - 1, Number(d[2])).getDay()];
        var top = el('div', 'record-top');
        var db = el('div', 'date-block');
        db.setAttribute('aria-label', d[0] + '년 ' + Number(d[1]) + '월 ' + Number(d[2]) + '일 ' + weekday);
        db.appendChild(el('span', 'month', d[0] + '.' + d[1]));
        db.appendChild(el('span', 'day', d[2]));
        db.appendChild(el('span', 'weekday', weekday));
        top.appendChild(db);
        var info = el('div');
        var label = r._status === 'seen' ? '관람 완료' : '예정';
        if (r === nextUpcoming) {
          var days = Math.round((new Date(r.date + 'T00:00:00+09:00') - new Date(today + 'T00:00:00+09:00')) / 86400000);
          label = days === 0 ? '오늘' : 'D-' + days;
        }
        info.appendChild(el('span', 'status', label));
        info.appendChild(el('h3', '', r.title));
        var place = [fmtTime(r.time), r.venue].filter(Boolean).join(' · ');
        if (place) info.appendChild(el('p', 'place', place));
        top.appendChild(info);
        card.appendChild(top);

        if (r.artists && r.artists.length) {
          var artists = createFoldSection('작가', r.artists.length + '명');
          var links = el('div', 'artist-list');
          r.artists.forEach(function (n) { links.appendChild(createLink(n, 'artist', n)); });
          artists.body.appendChild(links);
          card.appendChild(artists.section);
        }
        if (r.memo) {
          var memo = createFoldSection('메모', '');
          memo.body.appendChild(el('p', 'memo-text', r.memo));
          card.appendChild(memo.section);
        }
        var actions = el('div', 'record-actions');
        var edit = el('button', '', '수정');
        edit.type = 'button';
        edit.setAttribute('data-edit', r.id);
        actions.appendChild(edit);
        card.appendChild(actions);
        qsa(':scope > details', card).forEach(function (d) {
          if (openRows.indexOf(r.id + '|' + d.querySelector('summary').textContent) !== -1) d.open = true;
        });
        recordsPanel.insertBefore(card, emptyBox);
      });

      qsa('.filter').forEach(function (b) {
        b.textContent = b.getAttribute('data-label') + ' ' + counts[b.getAttribute('data-filter')];
      });
      emptyBox.style.display = shown.length ? 'none' : 'block';
      if (!shown.length) {
        emptyBox.querySelector('strong').textContent = !records.length ? '기록한 전시가 아직 없음' : filter === 'upcoming' ? '예정된 전시가 없음' : '관람 완료 기록이 아직 없음';
        $('empty-copy').textContent = !records.length ? '전시 추가를 눌러 보러 갈 전시를 기록하세요.' : filter === 'seen' ? '날짜가 지난 전시가 이곳에 정리됩니다.' : '';
      }
    }
    function activateFilter(button) {
      filter = button.getAttribute('data-filter');
      qsa('.filter').forEach(function (b) {
        var sel = b === button;
        b.setAttribute('aria-selected', sel ? 'true' : 'false');
        b.tabIndex = sel ? 0 : -1;
      });
      recordsPanel.setAttribute('aria-labelledby', button.id);
      renderRecords();
    }

    /* ---------- exhibits: sheet form ---------- */
    var sheet = $('sheet'), backdrop = $('sheet-backdrop');
    var editingId = null;
    var chosenArtists = [];
    var lastFocus = null;
    function renderChips() {
      var box = $('f-chips');
      box.textContent = '';
      chosenArtists.forEach(function (n) {
        var chip = el('span', 'chip');
        chip.appendChild(el('span', '', n));
        var x = el('button', 'chip-x', '삭제');
        x.type = 'button';
        x.setAttribute('aria-label', n + ' 삭제');
        x.setAttribute('data-chip', n);
        chip.appendChild(x);
        box.appendChild(chip);
      });
    }
    function openSheet(record) {
      lastFocus = document.activeElement;
      editingId = record ? record.id : null;
      $('sheet-title').textContent = record ? '전시 수정' : '전시 추가';
      $('f-title').value = record ? record.title : '';
      $('f-venue').value = record ? record.venue || '' : '';
      $('f-date').value = record ? record.date : todayKR();
      $('f-time').value = record ? record.time || '' : '';
      $('f-memo').value = record ? record.memo || '' : '';
      $('f-artist').value = '';
      chosenArtists = record ? (record.artists || []).slice() : [];
      renderChips();
      $('btn-delete').hidden = !record;
      $('form-error').hidden = true;
      backdrop.hidden = false;
      sheet.hidden = false;
      document.body.classList.add('sheet-open');
      window.setTimeout(function () { $('f-title').focus(); }, 30);
    }
    function closeSheet() {
      sheet.hidden = true;
      backdrop.hidden = true;
      document.body.classList.remove('sheet-open');
      if (lastFocus && lastFocus.focus) lastFocus.focus();
    }
    function addArtistFromInput() {
      var input = $('f-artist');
      var name = input.value.trim();
      if (!name) return;
      if (!artistByName[name]) {
        var err = $('form-error');
        err.textContent = '"' + name + '"은 수록 작가에 없음. 목록에서 고르세요.';
        err.hidden = false;
        return;
      }
      $('form-error').hidden = true;
      if (chosenArtists.indexOf(name) === -1) chosenArtists.push(name);
      input.value = '';
      renderChips();
    }
    function submitForm(event) {
      event.preventDefault();
      addArtistFromInput();
      var title = $('f-title').value.trim();
      var date = $('f-date').value;
      var err = $('form-error');
      if (!title || !date) {
        err.textContent = !title ? '전시명을 입력하세요.' : '날짜를 입력하세요.';
        err.hidden = false;
        return;
      }
      var data = { title: title, venue: $('f-venue').value.trim(), date: date, time: $('f-time').value, artists: chosenArtists.slice(), memo: $('f-memo').value.trim() };
      if (editingId) {
        records = records.map(function (r) { return r.id === editingId ? Object.assign({ id: r.id }, data) : r; });
      } else {
        data.id = 'e' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
        records.push(data);
      }
      if (!saveRecords()) return;
      closeSheet();
      renderRecords();
      showToast(editingId ? '전시를 수정함' : '전시를 저장함');
    }

    /* ---------- init + events ---------- */
    D.artists.forEach(function (a) {
      var o = document.createElement('option');
      o.value = a.short;
      $('artist-options').appendChild(o);
    });
    renderStudy();
    setRegion(storageGet('art-region'));
    selectCategory(storageGet('art-dictionary'));
    loadRecords();
    renderRecords();

    function wireTablist(buttons, activate) {
      buttons.forEach(function (button, index) {
        button.tabIndex = button.getAttribute('aria-selected') === 'true' ? 0 : -1;
        button.addEventListener('keydown', function (event) {
          var next = index;
          if (event.key === 'ArrowRight' || event.key === 'ArrowDown') next = (index + 1) % buttons.length;
          else if (event.key === 'ArrowLeft' || event.key === 'ArrowUp') next = (index - 1 + buttons.length) % buttons.length;
          else if (event.key === 'Home') next = 0;
          else if (event.key === 'End') next = buttons.length - 1;
          else return;
          event.preventDefault();
          buttons[next].focus();
          activate(buttons[next]);
        });
      });
    }
    primaryTabs.forEach(function (b) { b.addEventListener('click', function () { closeSearch(); activatePrimaryTab(b); }); });
    wireTablist(primaryTabs, activatePrimaryTab);
    studyTabs.forEach(function (b) { b.addEventListener('click', function () { closeSearch(); activateStudySection(b.getAttribute('data-study-section')); }); });
    wireTablist(studyTabs, function (b) { activateStudySection(b.getAttribute('data-study-section')); });
    var filters = qsa('.filter');
    filters.forEach(function (b) { b.addEventListener('click', function () { activateFilter(b); }); });
    wireTablist(filters, activateFilter);

    var categoryTabs = qsa('#dictionary-filters .chip-tab');
    categoryTabs.forEach(function (b) {
      b.addEventListener('click', function () { selectCategory(b.getAttribute('data-category')); backToTabs($('dictionary-filters')); });
    });
    wireTablist(categoryTabs, function (b) { selectCategory(b.getAttribute('data-category')); });
    var regionTabs = qsa('#region-tabs .chip-tab');
    regionTabs.forEach(function (b) {
      b.addEventListener('click', function () { setRegion(b.getAttribute('data-region-jump')); backToTabs($('region-tabs')); });
    });
    wireTablist(regionTabs, function (b) { setRegion(b.getAttribute('data-region-jump')); });

    // 펼친 제목을 눌러 접으면 화면이 그 제목 자리로 돌아온다
    var userToggled = null;
    document.addEventListener('click', function (event) {
      var summary = event.target.closest('summary');
      userToggled = summary ? summary.parentElement : null;
    }, true);
    document.addEventListener('toggle', function (event) {
      var details = event.target;
      if (details !== userToggled || details.open) return;
      userToggled = null;
      var stick = parseFloat(window.getComputedStyle(details).scrollMarginTop) || 0;
      if (details.getBoundingClientRect().top < stick) details.scrollIntoView({ block: 'start', behavior: 'instant' });
    }, true);

    var search = $('study-search');
    search.addEventListener('input', updateSearch);
    search.addEventListener('keydown', function (event) { if (event.key === 'Escape') { closeSearch(); search.blur(); } });
    document.addEventListener('click', function (event) {
      if (!event.target.closest('.study-search-wrap')) {
        $('study-search-results').hidden = true;
        search.setAttribute('aria-expanded', 'false');
      }
    });
    document.addEventListener('click', function (event) {
      var link = event.target.closest('[data-link-kind]');
      if (!link) return;
      goTo(link.getAttribute('data-link-kind'), link.getAttribute('data-link-value'));
    });

    $('add-record').addEventListener('click', function () { openSheet(null); });
    recordsPanel.addEventListener('click', function (event) {
      var edit = event.target.closest('[data-edit]');
      if (!edit) return;
      var id = edit.getAttribute('data-edit');
      var rec = records.filter(function (r) { return r.id === id; })[0];
      if (rec) openSheet(rec);
    });
    $('sheet-close').addEventListener('click', closeSheet);
    backdrop.addEventListener('click', closeSheet);
    document.addEventListener('keydown', function (event) { if (event.key === 'Escape' && !sheet.hidden) closeSheet(); });
    $('exhibit-form').addEventListener('submit', submitForm);
    $('f-artist').addEventListener('change', addArtistFromInput);
    $('f-artist').addEventListener('keydown', function (event) { if (event.key === 'Enter') { event.preventDefault(); addArtistFromInput(); } });
    $('f-chips').addEventListener('click', function (event) {
      var x = event.target.closest('[data-chip]');
      if (!x) return;
      chosenArtists = chosenArtists.filter(function (n) { return n !== x.getAttribute('data-chip'); });
      renderChips();
    });
    var deleteTimer;
    $('btn-delete').addEventListener('click', function () {
      if (!editingId) return;
      var btn = $('btn-delete');
      if (!btn.classList.contains('confirm')) {
        btn.classList.add('confirm');
        btn.textContent = '한 번 더 누르면 삭제';
        clearTimeout(deleteTimer);
        deleteTimer = setTimeout(function () { btn.classList.remove('confirm'); btn.textContent = '삭제'; }, 4000);
        return;
      }
      clearTimeout(deleteTimer);
      btn.classList.remove('confirm');
      btn.textContent = '삭제';
      records = records.filter(function (r) { return r.id !== editingId; });
      if (deletedIds.indexOf(editingId) < 0) deletedIds.push(editingId);
      try { window.localStorage.setItem(DELETED_KEY, JSON.stringify(deletedIds)); } catch (e) {}
      if (!saveRecords()) return;
      closeSheet();
      renderRecords();
      showToast('전시를 삭제함');
    });
    window.setInterval(renderRecords, 60000);
  }());
  </script>
</body>
</html>
